; Node A — the scale.
;
;   pio run                          build all four
;   pio run -e node-a-nodemcu -t upload    flash the board in hand over USB
;   pio device monitor               serial console at 115200
;
; Two chips. The lab handed over an ESP8266 NodeMCU, so that is the board the
; scale runs on. The ESP32 DevKit on the original request is still built: the
; Wokwi simulator has no ESP8266, and its sketch is made from the same code.
;
; Builds with no board attached, which is how this was developed.

[env]
framework = arduino
monitor_speed = 115200

lib_deps =
    ; HX711 24-bit ADC driver. Long-standing, widely used, no dependencies.
    bogde/HX711@^0.7.5
    ; SSD1306 over I2C.
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9

build_flags =
    ; Keep the compiler loud: a firmware bug found at compile time costs
    ; minutes, the same bug found on a bench costs an afternoon.
    -Wall
    ; The ESP-NOW frame layout, shared with Node B.
    -I ../shared

; --- the board in hand: ESP8266 NodeMCU (CH340, "LoLin V3" layout) -----------

[env:node-a-nodemcu]
platform = espressif8266
board = nodemcuv2
; The CH340 on these boards is not always happy at 921600.
upload_speed = 460800

; ---------------------------------------------------------------------------
; Simulation builds. Fake the load cell, so the whole pipeline -- weight, OLED,
; buttons, ESP-NOW, the camera node, the backend -- can be exercised on a bare
; board before the HX711 arrives. Set the weight from the serial console with
; `sim <grams>`.
;
;   pio run -e node-a-nodemcu-sim -t upload
; ---------------------------------------------------------------------------
[env:node-a-nodemcu-sim]
extends = env:node-a-nodemcu
build_flags =
    ${env.build_flags}
    -DSIMULATE_SCALE=1

; --- ESP32 DevKit V1 (WROOM-32): the request's board, and Wokwi's -----------

[env:node-a-scale]
platform = espressif32
board = esp32dev
upload_speed = 921600
build_flags =
    ${env.build_flags}
    -DCORE_DEBUG_LEVEL=1

[env:node-a-sim]
extends = env:node-a-scale
build_flags =
    ${env:node-a-scale.build_flags}
    -DSIMULATE_SCALE=1
