; Node B — the camera.
;
;   pio run              build
;   pio run -t upload    flash, through the ESP32-CAM-MB base
;   pio device monitor   serial console at 115200
;
; The Wi-Fi name, its password and the backend's address are not compiled in:
; they are set over the serial line and saved on the board (see README.md).

[env:node-b-camera]
platform = espressif32
board = esp32cam          ; AI-Thinker ESP32-CAM: PSRAM on, the large app partition
framework = arduino

monitor_speed = 115200
; The MB base's CH340 is not always happy at 921600.
upload_speed = 460800

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -Wall
    ; The ESP-NOW frame layout, shared with Node A.
    -I ../shared
