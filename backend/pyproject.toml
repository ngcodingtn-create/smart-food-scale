[project]
name = "smart-food-scale-backend"
version = "0.1.0"
description = "Backend for the Smart Food Scale — recognition, nutrition lookup, meal log"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
# So `pytest` works from backend/ without an editable install.
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN001", "ANN201"]
ignore = ["ANN101", "ANN102"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN001", "ANN201", "E402"]
